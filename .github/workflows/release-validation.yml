name: Финальные проверки / Release validation

on:
  push:
    branches: ['release-*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-validation-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  native:
    name: Linux release gate
    if: github.repository == 'Redaktor-clok/VoronDeck'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      HELIX_PATCHES_FROM_CLEAN: '1'
      SKIP_OPTIONAL_DEPS: '1'
      TEST_HOST: '0'
      HELIX_HEADLESS: '1'
      SDL_VIDEODRIVER: dummy
      LAND_GATE_BASE_REF: origin/main
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/init-submodules
      - name: Зависимости проверок / Test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang lld ccache cmake autoconf automake libtool \
            flex bison pkg-config libsdl2-dev libssl-dev libfmt-dev \
            libsystemd-dev libusb-1.0-0-dev libbluetooth-dev libasound2-dev \
            libnl-3-dev libnl-genl-3-dev libdrm-dev libinput-dev libudev-dev \
            libgbm-dev libegl1-mesa-dev libgles2-mesa-dev libcairo2-dev \
            libpango1.0-dev libjpeg-dev libpng-dev libxml2-utils \
            python3-venv shellcheck parallel jq rsync imagemagick
          npm install --prefix "$RUNNER_TEMP/bats" bats@1.11.1
          echo "$RUNNER_TEMP/bats/node_modules/.bin" >> "$GITHUB_PATH"
          python3 -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          docker pull espressif/idf:v5.5.5
      - name: Полный набор проверок / Full release gate
        run: |
          mkdir -p build/land-gate
          make land-gate 2>&1 | tee build/land-gate-run.log
      - name: Журналы / Logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-validation-${{ github.sha }}
          path: |
            build/land-gate/
            build/land-gate-run.log
          if-no-files-found: warn
          retention-days: 14
  plugin:
    name: Plugin regression
    if: github.repository == 'Redaktor-clok/VoronDeck'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest moonraker-plugin/tests -q --tb=short
