name: ARM64 пакет / ARM64 package

on:
  workflow_dispatch:

permissions:
  contents: read
  checks: read

concurrency:
  group: arm-package-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  arm64:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      HELIX_PATCHES_FROM_CLEAN: "1"
    steps:
      - name: Проверенные исходники / Verified source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?per_page=100" --jq '[.check_runs[] | select(.name == "Quality gate" and .conclusion == "success" and .app.slug == "github-actions")] | length')" -gt 0
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/init-submodules
      - name: Среда сборки / Toolchain
        run: docker build --pull -t vorondeck-arm64 -f .github/actions/docker/arm64.Dockerfile .
      - name: Сборка и проверка пакета / Build and verify package
        run: |
          mkdir -p build/package
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -e HELIX_PATCHES_FROM_CLEAN -e HELIX_GIT_HASH="$GITHUB_SHA" \
            -e CCACHE_DIR=/src/build/.ccache-arm -v "$PWD:/src" -w /src vorondeck-arm64 \
            bash .github/actions/scripts/build-arm-package.sh 2>&1 | tee build/package/build.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: success()
        with:
          name: arm64-package-${{ github.sha }}
          path: build/package/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: arm64-build-log-${{ github.sha }}
          path: build/package/build.log
          retention-days: 7
